## test with act
# act push \
#   -W .github/workflows/sam_certbot.yaml \
#   --secret-file .env \
#   -P ubuntu-22.04=catthehacker/ubuntu:act-22.04

name: CI/CD for sam certbot lambda
on:
  push:
    branches: [main]
    paths: ['aws/certbot_lambda/**', 'aws/template.yaml']
  pull_request:
    branches: [main]
    paths: ['aws/certbot_lambda/**', 'aws/template.yaml']
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CARGO_TERM_COLOR: always

jobs:
  build-and-check:
    name: Build & Test Certbot Lambda
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps + Python 3.13
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config zip make curl unzip \
            python3-pip software-properties-common \
            python3-distutils
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13 python3.13-venv python3.13-dev
          # set up 3.13 tooling
          python3.13 -m ensurepip --upgrade
          python3.13 -m pip install --upgrade pip setuptools wheel
          # install SAM into 3.13's user site so we don't touch system python
          python3.13 -m pip install --user aws-sam-cli
          # make sure ~/.local/bin is on PATH (act runner needs this explicitly)
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate SAM Template
        run: sam validate --template-file aws/template.yaml

      - name: Build Lambda
        run: make aws-sam-build

  deploy:
    name: Deploy Certbot Lambda
    runs-on: ubuntu-22.04
    needs: build-and-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps + Python 3.13
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config zip make curl unzip \
            python3-pip software-properties-common \
            python3-distutils
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13 python3.13-venv python3.13-dev
          python3.13 -m ensurepip --upgrade
          python3.13 -m pip install --upgrade pip setuptools wheel
          python3.13 -m pip install --user aws-sam-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambdas with SAM
        run: make aws-deploy-sam
