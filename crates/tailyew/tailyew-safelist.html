<!-- crates/tailyew/tailyew-safelist.html -->
 <!-- This file is only for Tailwind safelisting. It is not used at runtime. -->

<!-- 🧩 General structure for overlays, drawers, modals -->
<div class="bg-black bg-opacity-40 z-30 fixed inset-0"></div>
<div class="fixed top-0 right-0 w-64 h-full bg-white dark:bg-gray-900 shadow-lg z-40 p-4"></div>

<!-- 🧩 Navbar z-index -->
<div class="relative z-50"></div>

<!-- 🧩 Accordion / Disclosure / Transition classes -->
<div class="transition-all duration-300 ease-in-out transform origin-top"></div>
<div class="opacity-0 opacity-100 scale-y-0 scale-y-100 pointer-events-none hidden"></div>
<div class="overflow-hidden transition-[max-height] max-h-0 max-h-[1000px]"></div>

<!-- 🧩 Typography safelist (prose classes) -->
<div class="prose dark:prose-invert text-left max-w-none"></div>

<!-- 🧩 Form elements and Inputs if needed -->
<input class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm transition duration-150 focus:ring-2 focus:ring-primary focus:border-primary dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600 dark:focus:ring-primary-dark dark:focus:border-primary-dark" />
<button class="bg-primary text-white hover:bg-primary-dark bg-accent hover:bg-accent-dark text-white font-bold dark:bg-accent-dark dark:hover:bg-accent"></button>


<!-- 🧩 State classes (used for various components) -->
<div class="bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700"></div>
<div class="bg-gray-100 dark:bg-gray-800"></div>
<div class="border border-gray-300 dark:border-gray-700"></div>
<div class="text-gray-900 dark:text-gray-100"></div>
<div class="text-gray-700 dark:text-gray-200"></div>
<div class="text-blue-500 dark:text-blue-300 hover:text-blue-700 dark:hover:text-blue-500"></div>

<!-- 🧩 Other spacing, padding, radius that might be generated -->
<div class="px-3 py-2 px-4 py-3 p-2 rounded-lg shadow-md"></div>
