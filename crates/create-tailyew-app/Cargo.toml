[package]
name         = "create-tailyew-app"
version      = "0.1.2"
edition      = "2021"
authors      = ["Alex James <apjames93@gmail.com>"]
description  = "CLI to scaffold a new Tailyew Yew+Tailwind project"
license      = "MIT"
readme       = "README.md"
repository   = "https://github.com/apjames93/tailyew"
homepage     = "https://tailyew.com/"
documentation= "https://tailyew.com"
keywords     = ["cli", "yew", "tailwind", "scaffold", "spa"]
categories   = ["command-line-utilities", "web-programming", "wasm"]


[lib]
path = "src/lib.rs"

[dependencies]
clap         = { version = "4", features = ["derive"] }
include_dir  = "0.7.4"
tera         = "1.20.0"
tailyew      = "0.1.30"
anyhow        = "1.0.98"
thiserror    = "2.0.12"
dialoguer    = "0.11.0"
